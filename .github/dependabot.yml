version: 2
updates:
  - package-ecosystem: "docker"
    directories:
      - "/apps/api/base/apisix"
      - "/apps/api/base/opa"
      - "/apps/auth/base"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"
    open-pull-requests-limit: 5
    groups:
      docker-minor-patch:
        update-types:
          - "minor"
          - "patch"
