apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ../../base/ort-runner
  - ort-runner-network-policy.yaml
  - http-route.yaml
  - oss-db.yaml
  - oss-secret.yaml
  - register-site-secret.yaml
  - don-crawler-secret.yaml
  - piwik-secret.yaml
namespace: tn-don-oss-test
namePrefix: don-oss-
labels:
  - pairs:
      app.kubernetes.io/part-of: oss
    includeSelectors: false
    includeTemplates: true
images:
  - name: don-oss-register
    newName: ghcr.io/developer-overheid-nl/don-oss-register
    newTag: 421731ab8236f6cc348d7a9c4734a2919f20d704
  - name: don-register-oss-site
    newName: ghcr.io/developer-overheid-nl/don-register-oss-site
    newTag: 22f26bdabce397bcadafc558c67d268d31e57d6d
  - name: don-crawler
    newName: ghcr.io/developer-overheid-nl/don-crawler
    newTag: 49163742a75491e83c7217ac06b4d7ac7846cca2
  - name: ort-runner
    newName: ghcr.io/developer-overheid-nl/ort-runner
    newTag: 8698c198d05290f4e0d8aa7ae607a17e7b7adaf0
  - name: ort-config
    newName: ghcr.io/developer-overheid-nl/ort-config
    newTag: v0.0.2
patches:
  # Keep in sync with base: CRAWL_STALE_AFTER_HOURS is intentionally env[0].
  - target:
      kind: Deployment
      name: oss-register-dpl
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "168"
  - target:
      kind: HTTPRoute
      name: http-route
    patch: |
      - op: replace
        path: /spec/hostnames/0
        value: oss-register.don.projects.digilab.network
  - target:
      kind: CronJob
      name: oss-crawler
    patch: |-
      - op: add
        path: /spec/suspend
        value: true
