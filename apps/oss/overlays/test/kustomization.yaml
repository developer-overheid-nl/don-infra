apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - http-route.yaml
  - oss-db.yaml
  - oss-secret.yaml
  - register-site-secret.yaml
  - don-crawler-secret.yaml
  - piwik-secret.yaml
namespace: tn-don-oss-test
namePrefix: don-oss-
labels:
  - pairs:
      app.kubernetes.io/part-of: oss
    includeSelectors: false
    includeTemplates: true
images:
  - name: don-oss-register
    newName: ghcr.io/developer-overheid-nl/don-oss-register
    newTag: 278055d7cdc06cf96b52b8404fda3db3e8df35e5
  - name: don-register-oss-site
    newName: ghcr.io/developer-overheid-nl/don-register-oss-site
    newTag: d75f65f11ceb0f640a4ad40cbf69c8bf1369eeae
  - name: don-crawler
    newName: ghcr.io/developer-overheid-nl/don-crawler
    newTag: 1dfd56d6f6e5db114dd4d6992d4dfc8a71ceae85
patches:
  # Keep in sync with base: CRAWL_STALE_AFTER_HOURS is intentionally env[0].
  - target:
      kind: Deployment
      name: oss-register-dpl
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "168"
  - target:
      kind: HTTPRoute
      name: http-route
    patch: |
      - op: replace
        path: /spec/hostnames/0
        value: oss-register.don.projects.digilab.network
  - target:
      kind: CronJob
      name: oss-crawler
    patch: |-
      - op: add
        path: /spec/suspend
        value: true
