apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - http-route.yaml
  - oss-db.yaml
  - oss-secret.yaml
  - register-site-secret.yaml
  - don-crawler-secret.yaml
  - piwik-secret.yaml
namespace: tn-don-oss-test
namePrefix: don-oss-
labels:
  - pairs:
      app.kubernetes.io/part-of: oss
    includeSelectors: false
    includeTemplates: true
images:
  - name: don-oss-register
    newName: ghcr.io/developer-overheid-nl/don-oss-register
    newTag: 5529c22cf7f4b28a2200de07475064517fe1aa0a
  - name: don-register-oss-site
    newName: ghcr.io/developer-overheid-nl/don-register-oss-site
    newTag: 4abf2a0725b1809fba04edf541701f09ac98d823
  - name: don-crawler
    newName: ghcr.io/developer-overheid-nl/don-crawler
    newTag: 84e39057b348866df1bcfd3c4192a4321b5fb1ac
patches:
  # Keep in sync with base: CRAWL_STALE_AFTER_HOURS is intentionally env[0].
  - target:
      kind: Deployment
      name: oss-register-dpl
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "168"
  - target:
      kind: HTTPRoute
      name: http-route
    patch: |
      - op: replace
        path: /spec/hostnames/0
        value: oss-register.don.projects.digilab.network
  - target:
      kind: CronJob
      name: oss-crawler
    patch: |-
      - op: add
        path: /spec/suspend
        value: true
