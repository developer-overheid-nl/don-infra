apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ../../base/ort-runner
  - ort-runner-network-policy.yaml
  - http-route.yaml
  - oss-db.yaml
  - oss-secret.yaml
  - register-site-secret.yaml
  - don-crawler-secret.yaml
  - piwik-secret.yaml
namespace: tn-don-oss-test
namePrefix: don-oss-
labels:
  - pairs:
      app.kubernetes.io/part-of: oss
    includeSelectors: false
    includeTemplates: true
images:
  - name: don-oss-register
    newName: ghcr.io/developer-overheid-nl/don-oss-register
    newTag: bf20734874def2ae2feb287ea02be2b020175f5a
  - name: don-register-oss-site
    newName: ghcr.io/developer-overheid-nl/don-register-oss-site
    newTag: 74e0900721659ef26afd39400dff0801928bccb5
  - name: don-crawler
    newName: ghcr.io/developer-overheid-nl/don-crawler
    newTag: 93ed6ac922f550d867536a4925831a53e8a40b17
  - name: ort-runner
    newName: ghcr.io/developer-overheid-nl/ort-runner
    newTag: a8019ecbd7b9f598f50359f5f1088a0819741b06
  - name: ort-config
    newName: ghcr.io/developer-overheid-nl/ort-config
    newTag: v0.0.2
patches:
  # Keep in sync with base: CRAWL_STALE_AFTER_HOURS is intentionally env[0].
  - target:
      kind: Deployment
      name: oss-register-dpl
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "720"
  - target:
      kind: HTTPRoute
      name: http-route
    patch: |
      - op: replace
        path: /spec/hostnames/0
        value: oss-register.don.projects.digilab.network
  # The runner talks to the register through the API gateway only, so OPA
  # checks its token for both reading repositories and delivering results.
  - target:
      kind: CronJob
      name: ort-runner
    patch: |-
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: ort-runner
      spec:
        jobTemplate:
          spec:
            template:
              spec:
                containers:
                  - name: ort-runner
                    env:
                      - name: ORT_REPOSITORIES_URL
                        value: https://api.don.projects.digilab.network/oss-register/v1/repositories
                      - name: ORT_RESULTS_URL
                        value: https://api.don.projects.digilab.network/oss-register/v1/scans
  - target:
      kind: CronJob
      name: oss-crawler
    # Crawl once a week on test. The crawls on test and prod use the same
    # gitlab.com rate limit, because they leave the cluster from the same IP.
    patch: |-
      - op: replace
        path: /spec/schedule
        value: "0 2 * * 6"
