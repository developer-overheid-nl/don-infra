apiVersion: batch/v1
kind: CronJob
metadata:
  name: ort-runner
spec:
  schedule: "0 2 */2 * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      # Just above ORT_BATCH_DEADLINE: room to report unfinished repositories.
      activeDeadlineSeconds: 169200
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          serviceAccountName: ort-runner
          securityContext:
            fsGroup: 1000
          initContainers:
            - name: ort-config
              image: ort-config
              volumeMounts:
                - name: config
                  mountPath: /target
          containers:
            - name: ort-runner
              image: ort-runner
              args: ["controller"]
              env:
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: ORT_BATCH_ID
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.labels['batch.kubernetes.io/job-name']
                - name: ORT_CONFIG_DIR
                  value: /config
                - name: ORT_REPOSITORIES_URL
                  value: http://don-oss-oss-register-svc:1337/v1/repositories
                - name: ORT_RESULTS_URL
                  value: ""
                - name: ORT_PARALLELISM
                  value: "10"
                - name: ORT_BATCH_DEADLINE
                  value: 46h
                - name: ORT_REPOSITORY_TIMEOUT
                  value: 10m
                - name: ORT_WORKER_MEMORY_REQUEST
                  value: 4Gi
                - name: ORT_WORKER_MEMORY_LIMIT
                  value: 8Gi
                - name: ORT_WORKER_CPU_REQUEST
                  value: 200m
                - name: ORT_WORKER_CPU_LIMIT
                  value: 2000m
                - name: ORT_WORKER_EPHEMERAL_STORAGE_REQUEST
                  value: 10Gi
                - name: ORT_WORKER_EPHEMERAL_STORAGE_LIMIT
                  value: 30Gi
                - name: ORT_REGISTER_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: don-crawler-secret
                      key: API_X_API_KEY
                - name: AUTH_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      name: don-crawler-secret
                      key: AUTH_CLIENT_ID
                - name: AUTH_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: don-crawler-secret
                      key: AUTH_CLIENT_SECRET
                - name: KEYCLOAK_BASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: don-crawler-secret
                      key: KEYCLOAK_BASE_URL
                - name: KEYCLOAK_REALM
                  valueFrom:
                    secretKeyRef:
                      name: don-crawler-secret
                      key: KEYCLOAK_REALM
                - name: AUTH_TOKEN_URL
                  value: "$(KEYCLOAK_BASE_URL)/realms/$(KEYCLOAK_REALM)/\
                    protocol/openid-connect/token"
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
          restartPolicy: Never
          volumes:
            - name: config
              emptyDir: {}
