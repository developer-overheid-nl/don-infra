apiVersion: batch/v1
kind: CronJob
metadata:
  name: oss-crawler
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          # The crawler does not use the Kubernetes API.
          automountServiceAccountToken: false
          # The image has no USER and runs as root. runAsNonRoot needs a USER in
          # the image first.
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: don-crawler
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              image: don-crawler
              env:
                - name: API_BASEURL
                  valueFrom:
                    secretKeyRef:
                      name: don-crawler-secret
                      key: API_BASEURL
                - name: API_X_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: don-crawler-secret
                      key: API_X_API_KEY
                - name: AUTH_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      name: don-crawler-secret
                      key: AUTH_CLIENT_ID
                - name: AUTH_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: don-crawler-secret
                      key: AUTH_CLIENT_SECRET
                - name: KEYCLOAK_BASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: don-crawler-secret
                      key: KEYCLOAK_BASE_URL
                - name: KEYCLOAK_REALM
                  valueFrom:
                    secretKeyRef:
                      name: don-crawler-secret
                      key: KEYCLOAK_REALM
                - name: GIT_OAUTH_CLIENTID
                  valueFrom:
                    secretKeyRef:
                      name: don-crawler-secret
                      key: GIT_OAUTH_CLIENTID
                - name: GIT_OAUTH_INSTALLATION_ID
                  valueFrom:
                    secretKeyRef:
                      name: don-crawler-secret
                      key: GIT_OAUTH_INSTALLATION_ID
                - name: GIT_OAUTH_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: don-crawler-secret
                      key: GIT_OAUTH_SECRET
                
              resources:
                requests:
                  cpu: 200m
                  memory: 1Gi
                limits:
                  cpu: 2000m
                  memory: 8Gi
          restartPolicy: OnFailure
