apiVersion: batch/v1
kind: CronJob
metadata:
  name: oss-crawler
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      # Stop a crawl that runs longer than 3 days. Crawls took 2.5 to 3.6 days
      # when they ran in parallel. Make this shorter when a crawl is faster.
      activeDeadlineSeconds: 259200
      template:
        spec:
          containers:
            - name: don-crawler
              image: don-crawler
              env:
                - name: API_BASEURL
                  valueFrom:
                    secretKeyRef:
                      name: don-crawler-secret
                      key: API_BASEURL
                - name: API_X_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: don-crawler-secret
                      key: API_X_API_KEY
                - name: AUTH_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      name: don-crawler-secret
                      key: AUTH_CLIENT_ID
                - name: AUTH_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: don-crawler-secret
                      key: AUTH_CLIENT_SECRET
                - name: KEYCLOAK_BASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: don-crawler-secret
                      key: KEYCLOAK_BASE_URL
                - name: KEYCLOAK_REALM
                  valueFrom:
                    secretKeyRef:
                      name: don-crawler-secret
                      key: KEYCLOAK_REALM
                - name: GIT_OAUTH_CLIENTID
                  valueFrom:
                    secretKeyRef:
                      name: don-crawler-secret
                      key: GIT_OAUTH_CLIENTID
                - name: GIT_OAUTH_INSTALLATION_ID
                  valueFrom:
                    secretKeyRef:
                      name: don-crawler-secret
                      key: GIT_OAUTH_INSTALLATION_ID
                - name: GIT_OAUTH_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: don-crawler-secret
                      key: GIT_OAUTH_SECRET
                
              resources:
                requests:
                  cpu: 200m
                  memory: 1Gi
                  ephemeral-storage: 512Mi
                limits:
                  cpu: 2000m
                  memory: 8Gi
                  # The data volume (5Gi) and the writable layer of the container.
                  ephemeral-storage: 6Gi
              volumeMounts:
                # The crawler clones each repository into /app/data/repos and
                # removes the clone after the scan.
                - name: data
                  mountPath: /app/data
          volumes:
            - name: data
              emptyDir:
                sizeLimit: 5Gi
          restartPolicy: OnFailure
