apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - http-route.yaml
  - source-meta-network-policy.yaml

namespace: tn-don-static-prod
namePrefix: don-static-

images:
  - name: static
    newName: ghcr.io/developer-overheid-nl/don-static
    newTag: a07dc8e165854f8963907b4bf2e1e172cfbe7a90
  - name: source-meta
    newName: ghcr.io/developer-overheid-nl/source-meta-schemas
    newTag: a07dc8e165854f8963907b4bf2e1e172cfbe7a90

patches:
  - target:
      kind: HTTPRoute
      name: http-route
    patch: |
      - op: replace
        path: /spec/hostnames/0
        value: static.developer.overheid.nl
  - target:
      kind: Deployment
      name: dpl
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
