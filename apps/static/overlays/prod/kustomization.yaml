apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - http-route.yaml

namespace: tn-don-static-prod
namePrefix: don-static-

images:
  - name: static
    newName: ghcr.io/developer-overheid-nl/don-static
    newTag: 11849888aed62dc6fde0b42f9aea15926c394a77
  - name: source-meta
    newName: ghcr.io/developer-overheid-nl/source-meta-schemas
    newTag: 11849888aed62dc6fde0b42f9aea15926c394a77

patches:
  - target:
      kind: HTTPRoute
      name: http-route
    patch: |
      - op: replace
        path: /spec/hostnames/0
        value: static.developer.overheid.nl
  - target:
      kind: Deployment
      name: dpl
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
