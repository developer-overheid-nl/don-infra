apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - http-route.yaml

namespace: tn-don-static-prod
namePrefix: don-static-

images:
  - name: static
    newName: ghcr.io/developer-overheid-nl/don-static
    newTag: 113e2b9192f7a457c10e11f7b1bac2db40eb919f

patches:
  - target:
      kind: HTTPRoute
      name: http-route
    patch: |
      - op: replace
        path: /spec/hostnames/0
        value: static.developer.overheid.nl
  - target:
      kind: Deployment
      name: dpl
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
