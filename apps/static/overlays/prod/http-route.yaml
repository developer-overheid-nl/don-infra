apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-route
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: tn-don
      namespace: istio-gateway
      sectionName: tn-don-prod-static
  hostnames:
    - set-in-overlay
  rules:
    # Alles, ook /schemas, komt uit nginx. De schema-bestanden staan daar onder
    # hun eigen naam (bv. /schemas/don/Api.schema.json), en de mappen onder
    # /schemas/ geven een JSON directory-listing voor de harvester van het
    # schema-register.
    - filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Access-Control-Allow-Origin
                value: "*"
              - name: Access-Control-Allow-Methods
                value: "GET, HEAD, OPTIONS"
      backendRefs:
        - name: svc
          kind: Service
          port: 80
