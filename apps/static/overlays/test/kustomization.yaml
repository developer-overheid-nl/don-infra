apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - http-route.yaml
  - source-meta-network-policy.yaml

namespace: tn-don-static-test
namePrefix: don-static-

images:
  - name: static
    newName: ghcr.io/developer-overheid-nl/don-static
    newTag: 8b8602d9fb8959e38a5a29ba1f46a44b65943be8
  - name: source-meta
    newName: ghcr.io/developer-overheid-nl/source-meta-schemas
    newTag: abaa05556f3de533442cfda43a20f8bec2fef0b6

patches:
  - target:
      kind: HTTPRoute
      name: http-route
    patch: |
      - op: replace
        path: /spec/hostnames/0
        value: static.don.projects.digilab.network
