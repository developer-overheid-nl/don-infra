apiVersion: apps/v1
kind: Deployment
metadata:
  name: tools-dpl
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 33%
  template:
    spec:
      containers:
        - name: don-tools-api
          image: don-tools-api
          ports:
            - name: http
              containerPort: 1338
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              cpu: 1400m
              memory: 4Gi
          # livenessProbe:
          #   httpGet:
          #     path: /
          #     port: 1338
          #   initialDelaySeconds: 3
          #   periodSeconds: 30
          # readinessProbe:
          #   httpGet:
          #     path: /
          #     port: 1338
          #   initialDelaySeconds: 3
          #   periodSeconds: 5
          env:
            - name: PDOK_REGISTER_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: tools-secret
                  key: PDOK_REGISTER_ENDPOINT
            - name: KEYCLOAK_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: tools-secret
                  key: KEYCLOAK_BASE_URL
            - name: KEYCLOAK_REALM
              valueFrom:
                secretKeyRef:
                  name: tools-secret
                  key: KEYCLOAK_REALM
            - name: AUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: tools-secret
                  key: AUTH_CLIENT_ID
            - name: AUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tools-secret
                  key: AUTH_CLIENT_SECRET
            # Events-agenda: dezelfde database en gebruiker als api-register (secret api-db), eigen schema.
            # De tabel events wordt per omgeving met de hand aangemaakt; zonder tabel geven de
            # events-endpoints 503 en logt de harvest een fout, de tools-endpoints werken gewoon.
            - name: DB_HOSTNAME
              valueFrom:
                secretKeyRef:
                  name: api-db
                  key: DB_HOSTNAME
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: api-db
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: api-db
                  key: DB_PASSWORD
            - name: DB_DBNAME
              valueFrom:
                secretKeyRef:
                  name: api-db
                  key: DB_DBNAME
            - name: DB_SCHEMA
              value: don_tools
