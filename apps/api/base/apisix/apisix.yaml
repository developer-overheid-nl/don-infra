apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: repo-apisix
spec:
  interval: 5m
  url: https://apache.github.io/apisix-helm-chart
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: apisix
spec:
  interval: 5m
  install:
    crds: Skip
  upgrade:
    crds: Skip
  chart:
    spec:
      chart: apisix
      version: 2.18.2
      sourceRef:
        kind: HelmRepository
        name: don-api-repo-apisix
  values:
    image:
      repository: apache/apisix
      tag: 3.19.0-ubuntu
    ingress-controller:
      enabled: true
      deployment:
        adcContainer:
          image:
            # The chart default is 0.27.1. Version 0.31.0 has no known CVEs.
            tag: "0.31.0"
      config:
        disableGatewayAPI: true
        provider:
          type: apisix-standalone
          initSyncDelay: 0s
      gatewayProxy:
        createDefault: true
        provider:
          controlPlane:
            service:
              name: don-api-apisix-admin
              port: 9180
            auth:
              type: AdminKey
              adminKey:
                valueFrom:
                  secretKeyRef:
                    name: don-api-apisix
                    key: admin
    # API-driven standalone mode: APISIX keeps its config in memory and
    # the ingress controller pushes the config to each APISIX pod.
    # This removes etcd.
    etcd:
      enabled: false
    replicaCount: 1
    ingress:
      enabled: true
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
      hosts:
        - host: set-in-overlay
          paths:
            - /
      tls:
        - hosts:
            - set-in-overlays
          secretName: api-tls
    apisix:
      nginx:
        # Moet groter zijn dan de syncPeriod (1m) van de ingress-controller,
        # anders hergebruikt ADC een keep-alive verbinding die APISIX net sluit
        # ("socket hang up" bij sync).
        keepaliveTimeout: 75s
        customLuaSharedDicts:
          - name: limit-count
            size: 50m
      plugins:
        - opa
        - limit-count
        - cors
        - proxy-rewrite
        - openid-connect
      admin:
        enable_admin_ui: true
        allow:
          ipList:
            - 0.0.0.0/0
        credentials:
          secretName: don-api-apisix
        enabled: true
        ingress:
          enabled: true
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-prod
          hosts:
            - host: set-in-overlay
              paths:
                - /
          tls:
            - hosts:
                - set-in-overlay
              secretName: api-admin-tls
      deployment:
        role: traditional
        role_traditional:
          config_provider: yaml
