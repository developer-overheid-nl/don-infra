apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: apisix-http-route
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: tn-don
      namespace: istio-gateway
      sectionName: tn-don-test
  hostnames:
    - set-in-overlay
  rules:
    # The APISIX gateway of Digilab in the namespace apisix. A ReferenceGrant
    # in that namespace allows this reference.
    - backendRefs:
        - name: apisix-test-gateway
          namespace: apisix
          kind: Service
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: apisix-admin-http-route
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: tn-don
      namespace: istio-gateway
      sectionName: tn-don-test
  hostnames:
    - set-in-overlay
  rules:
    - backendRefs:
        - name: don-api-apisix-admin
          kind: Service
          port: 9180
