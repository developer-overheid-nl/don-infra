apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: repo-open-telemetry
spec:
  interval: 10m
  url: https://open-telemetry.github.io/opentelemetry-helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opentelemetry-collector
spec:
  interval: 10m
  chart:
    spec:
      chart: opentelemetry-collector
      version: 0.165.0
      sourceRef:
        kind: HelmRepository
        name: don-api-repo-open-telemetry
  values:
    mode: daemonset

    image:
      repository: otel/opentelemetry-collector-contrib
    command:
      name: otelcol-contrib

    presets:
      logsCollection:
        enabled: true
        includeCollectorLogs: false
      kubernetesAttributes:
        enabled: true

    alternateConfig:
      exporters:
        otlphttp/loki:
          endpoint: http://don-api-loki-gateway.tn-don-api-test.svc.cluster.local/otlp
      extensions:
        health_check:
          endpoint: ${env:MY_POD_IP}:13133
      processors:
        batch: {}
        memory_limiter:
          check_interval: 5s
          limit_percentage: 80
          spike_limit_percentage: 25
      service:
        extensions:
          - health_check
        pipelines:
          logs:
            receivers: []
            processors:
              - memory_limiter
              - batch
            exporters:
              - otlphttp/loki

    ports:
      otlp:
        enabled: false
      otlp-http:
        enabled: false
      jaeger-compact:
        enabled: false
      jaeger-thrift:
        enabled: false
      jaeger-grpc:
        enabled: false
      zipkin:
        enabled: false

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
