apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: repo-grafana-community
spec:
  interval: 10m
  url: https://grafana-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
spec:
  interval: 10m
  chart:
    spec:
      chart: grafana
      version: 12.8.0
      sourceRef:
        kind: HelmRepository
        name: don-api-repo-grafana-community
  values:
    replicas: 1

    testFramework:
      enabled: false

    service:
      type: ClusterIP

    persistence:
      enabled: true
      size: 2Gi

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi

    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Loki
            uid: loki
            type: loki
            access: proxy
            url: http://don-api-loki-gateway.tn-don-api-test.svc.cluster.local
            isDefault: true
            jsonData:
              maxLines: 1000
