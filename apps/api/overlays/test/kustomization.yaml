apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ../../base/schema-register
  - ../../base/schema-register-site
  - ../../base/skills-register
  - ../../base/skills-register-site
  - register-site-http-route.yaml
  - schema-register-site-http-route.yaml
  - skills-register-site-http-route.yaml
  - apisix-http-route.yaml
  - register-site.yaml
  - tools-secret.yaml
  - api-register-secret.yaml
  - api-register-db.yaml
  - piwik-secret.yaml
  - opa-auth-config.yaml
  - apisix-rate-limit.yaml
  - apisix/routes/apisix-routes.yaml
  - schema-register.yaml
  - skills-register.yaml
namespace: tn-don-api-test
namePrefix: don-api-
images:
  - name: don-api-register
    newName: ghcr.io/developer-overheid-nl/don-api-register
    newTag: test-eaf58ce46cade90016bc85f6d96e6f698ff8da77
  - name: don-register-site
    newName: ghcr.io/developer-overheid-nl/don-register-site
    newTag: test-5f186b735ab54fec9c441d835bae627aa997282c
  - name: don-register-schema-site
    newName: ghcr.io/developer-overheid-nl/don-register-schema-site
    newTag: test-5f186b735ab54fec9c441d835bae627aa997282c
  - name: don-register-skills-site
    newName: ghcr.io/developer-overheid-nl/don-register-skills-site
    newTag: test-5f186b735ab54fec9c441d835bae627aa997282c
  - name: don-tools-api
    newName: ghcr.io/developer-overheid-nl/don-api-tools
    newTag: test-60f6f9b3b67fd8fcb999e555ccb2d0a05389beda
  - name: don-schema-register
    newName: ghcr.io/developer-overheid-nl/don-schema-register
    newTag: cd7fba312049039dd76e5e8ca6f2f13e78a4fd39
  - name: don-skills-register
    newName: ghcr.io/developer-overheid-nl/don-skills-register
    newTag: test-204f9164d48eb6f1e1f054d9ca0ff7f1d4a37060
patches:
  - target:
      kind: Deployment
      name: opa
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OPA_DEFAULT_RATE_LIMIT
          value: "100"
  - target:
      kind: HTTPRoute
      name: apisix-http-route
    patch: |
      - op: replace
        path: /spec/hostnames/0
        value: api.don.projects.digilab.network
  - target:
      kind: HTTPRoute
      name: register-site-http-route
    patch: |
      - op: replace
        path: /spec/hostnames/0
        value: api-register.don.projects.digilab.network
  - target:
      kind: HTTPRoute
      name: schema-register-site-http-route
    patch: |
      - op: replace
        path: /spec/hostnames/0
        value: schemas.don.projects.digilab.network
  - target:
      kind: HTTPRoute
      name: skills-register-site-http-route
    patch: |
      - op: replace
        path: /spec/hostnames/0
        value: skills-register.don.projects.digilab.network
  - target:
      kind: Deployment
      name: tools-dpl
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: PUBLIC_BASE_URL
          value: https://api.don.projects.digilab.network/tools
  - target:
      kind: Deployment
      name: schema-register-dpl
    patch: |
      - op: test
        path: /spec/template/spec/containers/0/env/8/name
        value: ENABLE_TYPESENSE
      - op: remove
        path: /spec/template/spec/containers/0/env/8/valueFrom
      - op: add
        path: /spec/template/spec/containers/0/env/8/value
        value: "false"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SOURCEMETA_PUBLIC_SCHEMA_BASE_URL
          value: https://static.don.projects.digilab.network/schemas/
