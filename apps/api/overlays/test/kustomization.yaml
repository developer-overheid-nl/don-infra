apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ../../base/schema-register
  - ../../base/schema-register-site
  - register-site-http-route.yaml
  - schema-register-site-http-route.yaml
  - apisix-http-route.yaml
  - apisix.yaml
  - register-site.yaml
  - tools-secret.yaml
  - api-register-secret.yaml
  - api-register-db.yaml
  - piwik-secret.yaml
  - opa-auth-config.yaml
  - apisix/routes/apisix-routes.yaml
  - schema-register.yaml
  - observability/
namespace: tn-don-api-test
namePrefix: don-api-
images:
  - name: don-api-register
    newName: ghcr.io/developer-overheid-nl/don-api-register
    newTag: 6094913b79120150e4a1143d10bef29c00eabc31
  - name: don-register-site
    newName: ghcr.io/developer-overheid-nl/don-register-site
    newTag: 4a1aa9c219c9aee0ba29d52556d2cd7cbd874b83
  - name: don-register-schema-site
    newName: ghcr.io/developer-overheid-nl/don-register-schema-site
    newTag: 4a1aa9c219c9aee0ba29d52556d2cd7cbd874b83
  - name: don-tools-api
    newName: ghcr.io/developer-overheid-nl/don-tools-api
    newTag: 2b1a517f1ba0f7ce76da54e1f6f38ae7d086a1cf
  - name: don-schema-register
    newName: ghcr.io/developer-overheid-nl/don-schema-register
    newTag: ccdd08456a42c141db5391e1f4834d72f35afd4e
patches:
  - target:
      kind: HelmRelease
      name: apisix
    patch: |
      - op: add
        path: /spec/releaseName
        value: don-api-apisix-test
      - op: add
        path: /spec/values/fullnameOverride
        value: don-api-apisix
      - op: add
        path: /spec/values/ingress-controller/config/controllerName
        value: apisix.apache.org/apisix-ingress-controller-test
      - op: add
        path: /spec/values/ingress-controller/config/kubernetes
        value:
          ingressClass: apisix-test
      - op: replace
        path: /spec/values/replicaCount
        value: 1
      - op: replace
        path: /spec/values/ingress/enabled
        value: false
      - op: replace
        path: /spec/values/apisix/admin/ingress/enabled
        value: false
  - target:
      kind: HTTPRoute
      name: apisix-http-route
    patch: |
      - op: replace
        path: /spec/hostnames/0
        value: api.don.projects.digilab.network
  - target:
      kind: HTTPRoute
      name: apisix-admin-http-route
    patch: |
      - op: replace
        path: /spec/hostnames/0
        value: api-admin.don.projects.digilab.network
  - target:
      kind: HTTPRoute
      name: register-site-http-route
    patch: |
      - op: replace
        path: /spec/hostnames/0
        value: api-register.don.projects.digilab.network
  - target:
      kind: HTTPRoute
      name: schema-register-site-http-route
    patch: |
      - op: replace
        path: /spec/hostnames/0
        value: schemas.don.projects.digilab.network
  - target:
      kind: Deployment
      name: schema-register-dpl
    patch: |
      - op: test
        path: /spec/template/spec/containers/0/env/8/name
        value: ENABLE_TYPESENSE
      - op: remove
        path: /spec/template/spec/containers/0/env/8/valueFrom
      - op: add
        path: /spec/template/spec/containers/0/env/8/value
        value: "false"
