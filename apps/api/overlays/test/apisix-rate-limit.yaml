apiVersion: apisix.apache.org/v2
kind: ApisixPluginConfig
metadata:
  name: authenticated-rate-limit
spec:
  ingressClassName: apisix-test
  plugins:
    - name: limit-count
      enable: true
      config:
        count: "$http_x_opa_rate_limit"
        time_window: 60
        key_type: var
        key: http_x_opa_client_id
        # APISIX vereist een nieuwe groepsnaam wanneer de limit-count-configuratie wijzigt.
        group: authenticated-api-users-dynamic-v1
        policy: local
        # Houd requests beschikbaar als de dynamische variabele tijdens een rollout kort ontbreekt.
        allow_degradation: true
        rejected_code: 429
