apiVersion: apisix.apache.org/v2
kind: ApisixPluginConfig
metadata:
  name: authenticated-rate-limit
spec:
  ingressClassName: apisix-don-test
  plugins:
    - name: limit-count
      enable: true
      config:
        count: "$http_x_opa_rate_limit"
        time_window: 60
        key_type: var
        key: http_x_opa_client_id
        # Geen group: APISIX 3.19 lost een dynamische count met group niet op en
        # geeft dan 500. Zonder group telt elke route per client apart.
        policy: local
        # Houd requests beschikbaar als de dynamische variabele tijdens een rollout kort ontbreekt.
        allow_degradation: true
        rejected_code: 429
