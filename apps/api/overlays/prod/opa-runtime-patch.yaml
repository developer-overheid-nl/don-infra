apiVersion: apps/v1
kind: Deployment
metadata:
  name: opa
spec:
  replicas: 2
  template:
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: opa
      containers:
        - name: opa
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
          args:
            - run
            - --server
            - --addr=0.0.0.0:8181
            - --log-level=info
            - --ignore=.*
            - /policies
            - /data
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 512Mi
