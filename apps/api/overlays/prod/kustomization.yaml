apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ../../base/schema-register
  - ../../base/schema-register-site
  - register-site-http-route.yaml
  - schema-register-site-http-route.yaml
  - apisix-http-route.yaml
  - apisix.yaml
  - register-site.yaml
  - tools-secret.yaml
  - api-register-secret.yaml
  - api-register-db.yaml
  - piwik-secret.yaml
  - opa-auth-config.yaml
  - apisix-rate-limit.yaml
  - apisix/routes/apisix-routes.yaml
  - opa-resilience.yaml
  - opa-alerting.yaml
  - platform-alerting.yaml
  - schema-register.yaml
namespace: tn-don-api-prod
namePrefix: don-api-
images:
  - name: don-api-register
    newName: ghcr.io/developer-overheid-nl/don-api-register
    newTag: edd379659d20ae4bd7c81ef1393c5fa77b98cfa9
  - name: don-register-site
    newName: ghcr.io/developer-overheid-nl/don-register-site
    newTag: 45108394339a00f0c0c894839a9cb12791c8aeb4
  - name: don-register-schema-site
    newName: ghcr.io/developer-overheid-nl/don-register-schema-site
    newTag: 45108394339a00f0c0c894839a9cb12791c8aeb4
  - name: don-tools-api
    newName: ghcr.io/developer-overheid-nl/don-api-tools
    newTag: e16a67c10e0465e64fbddcf24bd5b84e7fe14c68
  - name: don-schema-register
    newName: ghcr.io/developer-overheid-nl/don-schema-register
    newTag: f8fb806057662f4668af4157f999862d697849b6
patches:
  - path: opa-runtime-patch.yaml
  - target:
      kind: Deployment
      name: tools-dpl
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: PUBLIC_BASE_URL
          value: https://api.developer.overheid.nl/tools
  - target:
      kind: HelmRelease
      name: apisix
    patch: |
      - op: add
        path: /spec/releaseName
        value: don-api-apisix-prod
      - op: add
        path: /spec/values/fullnameOverride
        value: don-api-apisix
      - op: add
        path: /spec/values/ingress-controller/config/controllerName
        value: apisix.apache.org/apisix-ingress-controller-prod
      - op: add
        path: /spec/values/ingress-controller/config/kubernetes
        value:
          ingressClass: apisix-prod
      # Two gateway pods on different nodes, so that one pod can restart
      # while the other pod serves traffic.
      - op: replace
        path: /spec/values/replicaCount
        value: 2
      - op: add
        path: /spec/values/podDisruptionBudget
        value:
          enabled: true
          minAvailable: 1
      - op: add
        path: /spec/values/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: apisix
                app.kubernetes.io/instance: don-api-apisix-prod
      # Two ingress controller pods. Leader election makes one pod active.
      # The other pod takes over when the active pod stops.
      # Add each key on its own. An add of the whole deployment map replaces
      # the adcContainer image from the base.
      - op: add
        path: /spec/values/ingress-controller/deployment/replicas
        value: 2
      - op: add
        path: /spec/values/ingress-controller/deployment/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: ingress-controller
                app.kubernetes.io/instance: don-api-apisix-prod
      - op: replace
        path: /spec/values/ingress/enabled
        value: false
      - op: replace
        path: /spec/values/apisix/admin/ingress/enabled
        value: false
  - target:
      kind: HTTPRoute
      name: apisix-http-route
    patch: |
      - op: replace
        path: /spec/hostnames/0
        value: api.developer.overheid.nl
  - target:
      kind: HTTPRoute
      name: apisix-admin-http-route
    patch: |
      - op: replace
        path: /spec/hostnames/0
        value: api-admin.developer.overheid.nl
  - target:
      kind: HTTPRoute
      name: register-site-http-route
    patch: |
      - op: replace
        path: /spec/hostnames/0
        value: apis.developer.overheid.nl
  - target:
      kind: HTTPRoute
      name: schema-register-site-http-route
    patch: |
      - op: replace
        path: /spec/hostnames/0
        value: schemas.developer.overheid.nl
  - target:
      kind: Deployment
      name: schema-register-dpl
    patch: |
      - op: test
        path: /spec/template/spec/containers/0/env/8/name
        value: ENABLE_TYPESENSE
      - op: replace
        path: /spec/template/spec/containers/0/env/8
        value:
          name: ENABLE_TYPESENSE
          value: "false"
      - op: test
        path: /spec/template/spec/containers/0/env/9/name
        value: SOURCEMETA_ONE_API_BASE
      - op: replace
        path: /spec/template/spec/containers/0/env/9
        value:
          name: SOURCEMETA_ONE_API_BASE
          value: http://don-static-source-meta-svc.tn-don-static-prod.svc.cluster.local:8000/schemas/
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SOURCEMETA_PUBLIC_SCHEMA_BASE_URL
          value: https://static.developer.overheid.nl/schemas/
