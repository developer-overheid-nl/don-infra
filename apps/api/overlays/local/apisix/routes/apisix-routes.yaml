---
apiVersion: v1
kind: Service
metadata:
  name: oss-register-external
spec:
  type: ExternalName
  externalName: don-oss-oss-register-svc.tn-don-oss.svc.cluster.local
  ports:
  - name: http
    port: 1337
    targetPort: 1337
---
apiVersion: apisix.apache.org/v2
kind: ApisixUpstream
metadata:
  name: oss-register-upstream
spec:
  ingressClassName: apisix-local
  externalNodes:
  - type: Service
    name: oss-register-external
    port: 1337
---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: api-routes
spec:
  ingressClassName: apisix-local
  http:
  - name: tools-api-v1-validatoropenapipost
    match:
      paths:
      - "/tools/v1/oas/validate"
      methods:
      - POST
    plugins:
    - name: proxy-rewrite
      enable: true
      config:
        regex_uri:
        - "^/tools/(.*)"
        - "/$1"
        use_real_request_uri_unsafe: false
    - name: cors
      enable: true
      config:
        allow_origins: "*"
        allow_credential: false
        allow_headers: Authorization,Content-Type
        allow_methods: POST,OPTIONS
        max_age: 5
    - name: opa
      enable: true
      config:
        host: http://don-api-opa:8181
        policy: apisix/authz/result
        timeout: 3000
        with_route: true
    timeout:
      connect: 60s
      send: 60s
      read: 60s
    backends:
    - serviceName: tools-svc
      servicePort: 1338
