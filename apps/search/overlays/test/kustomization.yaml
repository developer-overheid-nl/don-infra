apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - http-route.yaml
  - api-key.yaml

namespace: tn-don-search-test
namePrefix: don-search-

commonLabels:
  app: search

images:
  - name: typesense
    newName: typesense/typesense
    newTag: "29.1"

patches:
  - target:
      kind: HTTPRoute
      name: http-route
    patch: |
      - op: replace
        path: /spec/hostnames/0
        value: search.don.projects.digilab.network
  - target:
      kind: Deployment
      name: dpl
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: TYPESENSE_CORS_DOMAINS
          value: "https://developer.overheid.nl,https://site.don.projects.digilab.network"
