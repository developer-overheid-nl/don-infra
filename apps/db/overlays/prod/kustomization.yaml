apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - cnpg-object-store.yaml
  - cnpg-scheduled-backup.yaml
  - secret-s3-db-backups-creds.yaml

namespace: tn-don-db-prod
namePrefix: don-db-

patches:
  - target:
      kind: Cluster
      name: postgres
    patch: |
      - op: replace
        path: /spec/instances
        value: 2
      - op: replace
        path: /spec/storage/size
        value: 8Gi
      # During a rolling update, promote the updated replica instead of a
      # restart of the primary. A restart waits for smartShutdownTimeout
      # (180s) and stops the database for about 3.5 minutes. A switchover
      # stops it for some seconds. The switchover needs the barman sidecar
      # on the primary to archive the last WAL. All instances have it.
      - op: add
        path: /spec/primaryUpdateMethod
        value: switchover
      - op: add
        path: /spec/plugins
        value:
          - name: barman-cloud.cloudnative-pg.io
            isWALArchiver: true
            parameters:
              # ObjectStore/Secret get the "don-db-" namePrefix; reference the
              # built name (kustomize does not rewrite CRD-internal refs).
              barmanObjectName: don-db-garage
              # Namespace the shared bucket per tenant/cluster so backups can't collide.
              serverName: tn-don-db-prod/don-db-postgres
