apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: tn-don-db-test
namePrefix: don-db-

patches:
  - target:
      kind: Cluster
      name: postgres
    patch: |
      - op: replace
        path: /spec/imageCatalogRef/name
        value: postgresql-standard-trixie-test
      # Postgres 18 first on test (#432). CNPG upgrades in place (pg_upgrade)
      # when the major changes; a major cannot go back. Prod follows via the
      # base once test runs well.
      - op: replace
        path: /spec/imageCatalogRef/major
        value: 18
      # With 1 instance the primary cannot move, so the PodDisruptionBudget
      # blocks every node drain. Test accepts the interruption instead.
      - op: add
        path: /spec/enablePDB
        value: false
