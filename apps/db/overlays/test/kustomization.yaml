apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: tn-don-db-test
namePrefix: don-db-

patches:
  - target:
      kind: Cluster
      name: postgres
    patch: |
      - op: replace
        path: /spec/imageCatalogRef/name
        value: postgresql-standard-trixie-test
      # Test runs PostgreSQL 18 before prod. CNPG does an in-place major
      # upgrade (pg_upgrade). Move this to the base after prod is upgraded.
      - op: replace
        path: /spec/imageCatalogRef/major
        value: 18
