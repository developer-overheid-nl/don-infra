apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
spec:
  bootstrap:
    initdb:
      database: don
      owner: don
  # The platform ClusterImageCatalog pins the image by digest.
  # Platform Renovate updates the catalog. The test overlay uses the test catalog.
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgresql-standard-trixie
    major: 17
  instances: 1
  storage:
    size: 2Gi
